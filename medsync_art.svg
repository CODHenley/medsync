<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

  <!-- ════════════════════════════════
       CAT  (left, centered ~x=118)
  ════════════════════════════════════ -->

  <!-- Tail — curls inward toward bottle -->
  <path d="M 148,252 C 178,268 210,254 214,228 C 218,204 200,196 186,205 C 173,213 178,230 164,234"
        stroke="#1C2B4A" stroke-width="4"/>

  <!-- Body -->
  <path d="M 86,162 C 84,153 92,146 118,144 C 144,144 152,153 150,163
           L 148,265 C 148,274 138,278 118,278 C 98,278 88,274 88,265 Z"
        stroke="#1C2B4A" stroke-width="3.5"/>

  <!-- Head -->
  <ellipse cx="118" cy="116" rx="42" ry="40" stroke="#1C2B4A" stroke-width="3.5"/>

  <!-- Left ear outer -->
  <path d="M 88,98 L 80,58 L 114,82 Z" stroke="#1C2B4A" stroke-width="3.5"/>
  <!-- Left ear inner -->
  <path d="M 92,94 L 86,65 L 110,80 Z" stroke="#C83803" stroke-width="2.2" fill="#C83803" opacity="0.3"/>

  <!-- Right ear outer -->
  <path d="M 148,98 L 156,58 L 122,82 Z" stroke="#1C2B4A" stroke-width="3.5"/>
  <!-- Right ear inner -->
  <path d="M 144,94 L 150,65 L 126,80 Z" stroke="#C83803" stroke-width="2.2" fill="#C83803" opacity="0.3"/>

  <!-- Eyes — almond slits, looking right toward bottle -->
  <path d="M 96,113 C 100,105 114,105 116,113 C 114,121 100,121 96,113 Z"
        fill="#1C2B4A" stroke="#1C2B4A" stroke-width="1.5"/>
  <circle cx="108" cy="110" r="2.2" fill="white"/>

  <path d="M 122,113 C 126,106 138,106 140,113 C 138,120 126,120 122,113 Z"
        fill="#1C2B4A" stroke="#1C2B4A" stroke-width="1.5"/>
  <circle cx="133" cy="110" r="2.2" fill="white"/>

  <!-- Nose -->
  <path d="M 115,128 L 118,122 L 121,128 Z" fill="#1C2B4A" stroke="#1C2B4A" stroke-width="1.2"/>

  <!-- Mouth -->
  <path d="M 114,130 C 114,136 118,139 118,139 C 118,139 122,136 122,130"
        stroke="#1C2B4A" stroke-width="2.2"/>

  <!-- Whiskers left -->
  <line x1="112" y1="130" x2="70" y2="122" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="112" y1="134" x2="68" y2="134" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="112" y1="138" x2="70" y2="146" stroke="#1C2B4A" stroke-width="1.8"/>
  <!-- Whiskers right -->
  <line x1="126" y1="130" x2="168" y2="122" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="126" y1="134" x2="170" y2="134" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="126" y1="138" x2="168" y2="146" stroke="#1C2B4A" stroke-width="1.8"/>

  <!-- Front paws -->
  <ellipse cx="103" cy="281" rx="15" ry="9" stroke="#1C2B4A" stroke-width="3"/>
  <ellipse cx="133" cy="281" rx="15" ry="9" stroke="#1C2B4A" stroke-width="3"/>
  <!-- Toe lines -->
  <line x1="96"  y1="276" x2="96"  y2="286" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="103" y1="274" x2="103" y2="286" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="110" y1="276" x2="110" y2="286" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="126" y1="276" x2="126" y2="286" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="133" y1="274" x2="133" y2="286" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="140" y1="276" x2="140" y2="286" stroke="#1C2B4A" stroke-width="1.8"/>

  <!-- ════════════════════════════════
       PILL BOTTLE  (center, x=260)
  ════════════════════════════════════ -->

  <!-- Bottle body -->
  <rect x="234" y="152" width="52" height="112" rx="9" stroke="#1C2B4A" stroke-width="3.5"/>

  <!-- Cap (orange) -->
  <rect x="226" y="132" width="68" height="28" rx="8" fill="#C83803" stroke="#1C2B4A" stroke-width="3"/>
  <!-- Cap grip ridges -->
  <line x1="242" y1="134" x2="242" y2="158" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="254" y1="134" x2="254" y2="158" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="266" y1="134" x2="266" y2="158" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="278" y1="134" x2="278" y2="158" stroke="white" stroke-width="1.5" opacity="0.35"/>

  <!-- Label -->
  <rect x="242" y="165" width="36" height="89" rx="4"
        fill="white" fill-opacity="0.92" stroke="#1C2B4A" stroke-width="1.8"/>

  <!-- Rx symbol -->
  <text x="260" y="198" font-family="Georgia,'Times New Roman',serif"
        font-size="21" font-weight="bold" fill="#1C2B4A" text-anchor="middle">℞</text>

  <!-- Label text lines -->
  <line x1="247" y1="212" x2="274" y2="212" stroke="#1C2B4A" stroke-width="1.4" opacity="0.4"/>
  <line x1="247" y1="221" x2="271" y2="221" stroke="#1C2B4A" stroke-width="1.4" opacity="0.4"/>
  <line x1="247" y1="230" x2="273" y2="230" stroke="#1C2B4A" stroke-width="1.4" opacity="0.4"/>
  <line x1="247" y1="239" x2="269" y2="239" stroke="#1C2B4A" stroke-width="1.4" opacity="0.4"/>

  <!-- ════════════════════════════════
       DOG  (right, centered ~x=400)
  ════════════════════════════════════ -->

  <!-- Body -->
  <path d="M 358,168 C 356,158 365,150 400,148 C 435,148 444,158 442,168
           L 440,266 C 440,275 428,279 400,279 C 372,279 360,275 360,266 Z"
        stroke="#1C2B4A" stroke-width="3.5"/>

  <!-- Head -->
  <ellipse cx="400" cy="116" rx="45" ry="43" stroke="#1C2B4A" stroke-width="3.5"/>

  <!-- Left floppy ear -->
  <path d="M 357,104 C 352,78 357,50 368,54 C 376,57 378,82 374,108"
        stroke="#1C2B4A" stroke-width="3.5" fill="#1C2B4A" fill-opacity="0.07"/>

  <!-- Right floppy ear -->
  <path d="M 443,104 C 448,78 443,50 432,54 C 424,57 422,82 426,108"
        stroke="#1C2B4A" stroke-width="3.5" fill="#1C2B4A" fill-opacity="0.07"/>

  <!-- Snout bulge -->
  <ellipse cx="400" cy="132" rx="27" ry="22" stroke="#1C2B4A" stroke-width="2.5"/>

  <!-- Eyes -->
  <circle cx="381" cy="106" r="8" fill="#1C2B4A"/>
  <circle cx="378" cy="103" r="2.8" fill="white"/>
  <circle cx="419" cy="106" r="8" fill="#1C2B4A"/>
  <circle cx="416" cy="103" r="2.8" fill="white"/>

  <!-- Nose -->
  <ellipse cx="400" cy="124" rx="10" ry="7" fill="#1C2B4A"/>
  <ellipse cx="398" cy="122" rx="3.2" ry="2.2" fill="white" opacity="0.38"/>

  <!-- Mouth (happy) -->
  <path d="M 388,136 C 390,144 400,147 400,147 C 400,147 410,144 412,136"
        stroke="#1C2B4A" stroke-width="2.5"/>

  <!-- Tongue -->
  <path d="M 394,147 C 392,158 396,165 400,165 C 404,165 408,158 406,147"
        stroke="#C83803" stroke-width="2" fill="#C83803" fill-opacity="0.75"/>

  <!-- Bandana (orange) -->
  <path d="M 367,156 L 400,178 L 433,156 L 424,146 L 376,146 Z"
        fill="#C83803" fill-opacity="0.88" stroke="#1C2B4A" stroke-width="2.5"/>
  <!-- Bandana knot dot -->
  <circle cx="400" cy="172" r="4" fill="#1C2B4A" opacity="0.5"/>

  <!-- Front paws -->
  <ellipse cx="378" cy="282" rx="16" ry="10" stroke="#1C2B4A" stroke-width="3"/>
  <ellipse cx="420" cy="282" rx="16" ry="10" stroke="#1C2B4A" stroke-width="3"/>
  <!-- Toe lines -->
  <line x1="371" y1="277" x2="371" y2="287" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="378" y1="274" x2="378" y2="287" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="385" y1="277" x2="385" y2="287" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="413" y1="277" x2="413" y2="287" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="420" y1="274" x2="420" y2="287" stroke="#1C2B4A" stroke-width="1.8"/>
  <line x1="427" y1="277" x2="427" y2="287" stroke="#1C2B4A" stroke-width="1.8"/>

  <!-- ════════════════════════════════
       SCATTERED PILLS & DETAILS
  ════════════════════════════════════ -->

  <!-- Capsule top-left, tilted -->
  <g transform="rotate(-28 60 78)">
    <rect x="40" y="70" width="40" height="17" rx="8.5" fill="#C83803" stroke="#1C2B4A" stroke-width="2.5"/>
    <line x1="60" y1="71" x2="60" y2="86" stroke="#1C2B4A" stroke-width="2"/>
    <rect x="60" y="70" width="20" height="17" rx="8.5" fill="white" fill-opacity="0.3"/>
  </g>

  <!-- Round tablet top-right, tilted -->
  <g transform="rotate(18 462 72)">
    <rect x="440" y="62" width="44" height="20" rx="10" stroke="#1C2B4A" stroke-width="2.5"/>
    <line x1="462" y1="64" x2="462" y2="80" stroke="#1C2B4A" stroke-width="1.8"/>
  </g>

  <!-- Small round pill, left of cat -->
  <circle cx="52" cy="200" r="13" stroke="#1C2B4A" stroke-width="2.5"/>
  <line x1="43" y1="200" x2="61" y2="200" stroke="#1C2B4A" stroke-width="1.8"/>

  <!-- Orange capsule bottom-right -->
  <g transform="rotate(32 465 285)">
    <rect x="444" y="277" width="42" height="18" rx="9" fill="#C83803" stroke="#1C2B4A" stroke-width="2.5"/>
    <line x1="465" y1="279" x2="465" y2="293" stroke="white" stroke-width="1.8" opacity="0.45"/>
    <rect x="465" y="277" width="21" height="18" rx="9" fill="white" fill-opacity="0.25"/>
  </g>

  <!-- Small round tablet near bottle, upper -->
  <circle cx="210" cy="100" r="12" stroke="#C83803" stroke-width="2.5"/>
  <line x1="200" y1="100" x2="220" y2="100" stroke="#C83803" stroke-width="1.8"/>

  <!-- Medical cross (upper center) -->
  <line x1="304" y1="56" x2="304" y2="78" stroke="#C83803" stroke-width="4"/>
  <line x1="293" y1="67" x2="315" y2="67" stroke="#C83803" stroke-width="4"/>

  <!-- Tiny scattered pill bottom-center -->
  <circle cx="300" cy="298" r="9" stroke="#1C2B4A" stroke-width="2.2"/>
  <line x1="293" y1="298" x2="307" y2="298" stroke="#1C2B4A" stroke-width="1.5"/>

</svg>
