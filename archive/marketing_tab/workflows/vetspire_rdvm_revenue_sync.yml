name: Vetspire rDVM Revenue Sync (Marketing)

# Populates ScoutSync's rdvm_revenue_daily (Marketing tab's Revenue by
# Referring Hospital section) from Vetspire's salesReport, broken down by
# RDVM_ID at day-level granularity -- see vetspire_financial_sync.py's
# module docstring and scoutsync_referral_marketing_analytics.sql.
#
# workflow_dispatch-only, no schedule yet -- this is a brand-new, unverified
# breakdown (RDVM_ID confirmed live only on its own, not yet in combination
# with anything else), so a human should dispatch this manually and confirm
# it upserts real rows before it's put on a recurring schedule as a later,
# separate change. Modeled on vetspire_financial_sync.yml (same secret name,
# same no-"Bearer"-prefix auth convention, same lookback_days input), but
# sets SYNC_RDVM_REVENUE=true so the (also gated) new code path in
# vetspire_financial_sync.py actually runs -- the routine 4-hourly workflow
# does not set that var, so this doesn't change its behavior at all.

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of history to pull (default 3; use e.g. 30 for a one-time backfill)'
        required: false
        default: '3'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Vetspire rDVM revenue sync
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
          SYNC_RDVM_REVENUE: 'true'
        run: python3 vetspire_financial_sync.py
