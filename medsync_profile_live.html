<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedSync — My Profile</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: #F4F4F4; color: #1C2B4A; min-height: 100vh; }

/* ── Nav ── */
.pf-nav {
  background: #1C2B4A;
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.pf-nav-back {
  display: flex;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.7);
  text-decoration: none;
  font-size: 12px;
  font-weight: 500;
  transition: color 0.15s;
}
.pf-nav-back:hover { color: #fff; }
.pf-nav-back svg { width: 16px; height: 16px; }
.pf-nav-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.15); }
.pf-nav-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); }
.pf-nav-logo { margin-left: auto; }

/* ── Page layout ── */
.pf-page { max-width: 900px; margin: 0 auto; padding: 28px 20px 48px; }
.pf-page-title { font-size: 22px; font-weight: 700; color: #1C2B4A; margin-bottom: 6px; }
.pf-page-sub { font-size: 13px; color: #8A93A8; margin-bottom: 24px; }

/* ── Two-column layout ── */
.pf-cols {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
@media (max-width: 680px) {
  .pf-cols { grid-template-columns: 1fr; }
}

/* ── Card ── */
.pf-card {
  background: #fff;
  border: 1px solid #DCD4EC;
  border-radius: 16px;
  overflow: hidden;
}
.pf-card-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid #F4F4F4;
}
.pf-card-header h3 { font-size: 14px; font-weight: 700; color: #1C2B4A; }
.pf-card-header p { font-size: 11px; color: #8A93A8; margin-top: 2px; }
.pf-card-body { padding: 20px; }

/* ── Avatar card (left) ── */
.pf-avatar-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 24px 20px;
}
.pf-avatar-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: #1C2B4A;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: 700;
  color: #fff;
  overflow: hidden;
  border: 3px solid #DCD4EC;
  flex-shrink: 0;
}
.pf-avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.pf-avatar-name { font-size: 15px; font-weight: 700; color: #1C2B4A; text-align: center; }
.pf-avatar-role { font-size: 11px; color: #8A93A8; text-align: center; }

.pf-upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #F0EEFA;
  border: 1px solid #DDD9EC;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 600;
  color: #1C2B4A;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
.pf-upload-btn:hover { background: #E4DCFA; }
input[type="file"] { display: none; }

/* ── Animal avatar picker ── */
.pf-animal-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
  text-transform: uppercase; color: #8A93A8;
  margin: 4px 0 8px; display: block; text-align: left; width: 100%;
}
.pf-animal-grid {
  display: grid; grid-template-columns: repeat(4, 48px);
  gap: 8px; justify-content: center; width: 100%;
}
.pf-animal-opt {
  width: 48px; height: 48px; border-radius: 50%;
  border: 2.5px solid transparent; cursor: pointer;
  overflow: hidden; transition: border-color 0.15s, transform 0.12s;
  background: #F0EEFA;
}
.pf-animal-opt:hover { transform: scale(1.1); border-color: #9B7FD4; }
.pf-animal-opt.selected { border-color: #6B4FBF; box-shadow: 0 0 0 3px rgba(107,79,191,.2); }

.pf-bio-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #8A93A8;
  margin-bottom: 6px;
  display: block;
  text-align: left;
  width: 100%;
}
.pf-bio-textarea {
  width: 100%;
  border: 1px solid #DCD4EC;
  border-radius: 10px;
  padding: 10px 12px;
  font-family: inherit;
  font-size: 12px;
  color: #1C2B4A;
  resize: vertical;
  min-height: 80px;
  line-height: 1.5;
  transition: border-color 0.15s;
}
.pf-bio-textarea:focus { outline: none; border-color: #C83803; box-shadow: 0 0 0 3px rgba(200,146,42,0.12); }
.pf-char-count { font-size: 10px; color: #8A93A8; text-align: right; margin-top: 4px; }

.pf-save-bio-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #C83803;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
  align-self: flex-end;
}
.pf-save-bio-btn:hover { background: #B86D00; }

/* ── Form fields (right card) ── */
.pf-form { display: flex; flex-direction: column; gap: 16px; }
.pf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .pf-row { grid-template-columns: 1fr; } }

.pf-field { display: flex; flex-direction: column; gap: 5px; }
.pf-field label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #8A93A8; }
.pf-field input, .pf-field select {
  border: 1px solid #DCD4EC;
  border-radius: 10px;
  padding: 9px 12px;
  font-family: inherit;
  font-size: 13px;
  color: #1C2B4A;
  background: #fff;
  transition: border-color 0.15s;
}
.pf-field input:focus { outline: none; border-color: #C83803; box-shadow: 0 0 0 3px rgba(200,146,42,0.12); }
.pf-field input[readonly], .pf-field input.readonly {
  background: #F8F7FC;
  color: #8A93A8;
  cursor: default;
}
.pf-field input[readonly]:focus { border-color: #DCD4EC; box-shadow: none; }
.pf-role-badge {
  display: inline-flex;
  align-items: center;
  background: #F4F4F4;
  border: 1px solid #DCD4EC;
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  color: #1C2B4A;
  width: fit-content;
}

.pf-save-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #1C2B4A;
  border: none;
  border-radius: 10px;
  padding: 11px 22px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
  align-self: flex-start;
  margin-top: 4px;
}
.pf-save-btn:hover { background: #2a3f6a; }

/* ── Password card ── */
.pf-pw-note {
  background: #F0EEFA;
  border: 1px solid #DCD4EC;
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 13px;
  color: #6B7A99;
  line-height: 1.6;
  margin-top: 4px;
}
.pf-pw-note a { color: #C83803; text-decoration: none; }
.pf-pw-note a:hover { text-decoration: underline; }

/* ── Toast ── */
.pf-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1C2B4A;
  color: #fff;
  padding: 11px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(28,43,74,0.25);
  z-index: 9999;
  transition: transform 0.3s ease;
  white-space: nowrap;
}
.pf-toast.show { transform: translateX(-50%) translateY(0); }
.pf-toast.success { background: #0F6E56; }
.pf-toast.error { background: #a33030; }
</style>
</head>
<body>

<!-- Nav -->
<nav class="pf-nav">
  <a href="medsync_portfolio_live.html" class="pf-nav-back">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 12L6 8l4-4"/>
    </svg>
    Dashboard
  </a>
  <div class="pf-nav-divider"></div>
  <span class="pf-nav-title">My Profile</span>

</nav>

<!-- Page -->
<main class="pf-page">
  <div class="pf-page-title" id="pf-page-heading">My Profile</div>
  <div class="pf-page-sub">Manage your personal information, photo, and bio.</div>

  <div class="pf-cols">
    <!-- Left: Avatar + Bio -->
    <div class="pf-card">
      <div class="pf-avatar-wrap">
        <div class="pf-avatar-circle" id="pf-avatar-circle">
          <span id="pf-avatar-initials">MH</span>
        </div>
        <div>
          <div class="pf-avatar-name" id="pf-display-name">MedSync User</div>
          <div class="pf-avatar-role" id="pf-display-role">Staff</div>
        </div>
        <button class="pf-upload-btn" onclick="document.getElementById('pf-photo-input').click()">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13l3-3 2 2 4-5 3 5H2z"/><circle cx="5" cy="5" r="1.5"/></svg>
          Upload Photo
        </button>
        <input type="file" id="pf-photo-input" accept="image/*" onchange="handlePhotoUpload(this)">

        <!-- Animal avatar picker -->
        <div style="width:100%;">
          <span class="pf-animal-label">— or choose an avatar —</span>
          <div class="pf-animal-grid" id="pf-animal-grid">
            <!-- Dog -->
            <div class="pf-animal-opt" title="Dog" onclick="selectAnimalAvatar(this,'dog')" data-key="dog">
              <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="24" fill="#F9E4C8"/>
                <!-- ears -->
                <ellipse cx="13" cy="18" rx="6" ry="9" fill="#C8935A" transform="rotate(-15 13 18)"/>
                <ellipse cx="35" cy="18" rx="6" ry="9" fill="#C8935A" transform="rotate(15 35 18)"/>
                <ellipse cx="13" cy="18" rx="3.5" ry="6.5" fill="#E8B07A" transform="rotate(-15 13 18)"/>
                <ellipse cx="35" cy="18" rx="3.5" ry="6.5" fill="#E8B07A" transform="rotate(15 35 18)"/>
                <!-- head -->
                <ellipse cx="24" cy="26" rx="14" ry="13" fill="#E8B07A"/>
                <!-- eyes -->
                <circle cx="19" cy="23" r="2.5" fill="#3A2A1A"/>
                <circle cx="29" cy="23" r="2.5" fill="#3A2A1A"/>
                <circle cx="20" cy="22.2" r="0.9" fill="#fff"/>
                <circle cx="30" cy="22.2" r="0.9" fill="#fff"/>
                <!-- muzzle -->
                <ellipse cx="24" cy="30" rx="6" ry="4" fill="#F9D4A8"/>
                <!-- nose -->
                <ellipse cx="24" cy="28" rx="2.5" ry="1.7" fill="#3A2A1A"/>
                <!-- mouth -->
                <path d="M21 31 Q24 34 27 31" stroke="#3A2A1A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
              </svg>
            </div>
            <!-- Cat -->
            <div class="pf-animal-opt" title="Cat" onclick="selectAnimalAvatar(this,'cat')" data-key="cat">
              <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="24" fill="#E8E4F0"/>
                <!-- ears -->
                <polygon points="10,20 16,6 20,20" fill="#B0A0C8"/>
                <polygon points="38,20 32,6 28,20" fill="#B0A0C8"/>
                <polygon points="12,19 16,9 19,19" fill="#F0D0D8"/>
                <polygon points="36,19 32,9 29,19" fill="#F0D0D8"/>
                <!-- head -->
                <ellipse cx="24" cy="27" rx="13" ry="12" fill="#C8BCDC"/>
                <!-- eyes -->
                <ellipse cx="19" cy="24" rx="2.5" ry="3" fill="#5A8A3A"/>
                <ellipse cx="29" cy="24" rx="2.5" ry="3" fill="#5A8A3A"/>
                <ellipse cx="19" cy="24" rx="1" ry="2.5" fill="#1A1A2A"/>
                <ellipse cx="29" cy="24" rx="1" ry="2.5" fill="#1A1A2A"/>
                <circle cx="19.8" cy="23" r="0.7" fill="#fff"/>
                <circle cx="29.8" cy="23" r="0.7" fill="#fff"/>
                <!-- muzzle -->
                <ellipse cx="24" cy="31" rx="5" ry="3.5" fill="#F0E8F4"/>
                <!-- nose -->
                <polygon points="24,27.5 22.5,29.5 25.5,29.5" fill="#D070A0"/>
                <!-- mouth -->
                <path d="M22 30.5 Q24 33 26 30.5" stroke="#9A5070" stroke-width="1" fill="none" stroke-linecap="round"/>
                <!-- whiskers -->
                <line x1="10" y1="30" x2="19" y2="30.5" stroke="#9A8AAA" stroke-width="0.8"/>
                <line x1="10" y1="32" x2="19" y2="31.5" stroke="#9A8AAA" stroke-width="0.8"/>
                <line x1="38" y1="30" x2="29" y2="30.5" stroke="#9A8AAA" stroke-width="0.8"/>
                <line x1="38" y1="32" x2="29" y2="31.5" stroke="#9A8AAA" stroke-width="0.8"/>
              </svg>
            </div>
            <!-- Rabbit -->
            <div class="pf-animal-opt" title="Rabbit" onclick="selectAnimalAvatar(this,'rabbit')" data-key="rabbit">
              <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="24" fill="#F4F0F8"/>
                <!-- tall ears -->
                <ellipse cx="17" cy="12" rx="5" ry="10" fill="#E0D8EC"/>
                <ellipse cx="31" cy="12" rx="5" ry="10" fill="#E0D8EC"/>
                <ellipse cx="17" cy="12" rx="2.8" ry="7.5" fill="#F4B8C8"/>
                <ellipse cx="31" cy="12" rx="2.8" ry="7.5" fill="#F4B8C8"/>
                <!-- head -->
                <ellipse cx="24" cy="30" rx="12" ry="11" fill="#E8E0F4"/>
                <!-- eyes -->
                <circle cx="19.5" cy="27.5" r="2.5" fill="#D060A0"/>
                <circle cx="28.5" cy="27.5" r="2.5" fill="#D060A0"/>
                <circle cx="19.5" cy="27.5" r="1.2" fill="#1A0A18"/>
                <circle cx="28.5" cy="27.5" r="1.2" fill="#1A0A18"/>
                <circle cx="20.2" cy="26.8" r="0.6" fill="#fff"/>
                <circle cx="29.2" cy="26.8" r="0.6" fill="#fff"/>
                <!-- nose -->
                <ellipse cx="24" cy="32" rx="1.8" ry="1.2" fill="#F07090"/>
                <!-- mouth -->
                <path d="M22 33 Q24 35.5 26 33" stroke="#C04070" stroke-width="1" fill="none" stroke-linecap="round"/>
                <line x1="24" y1="33.2" x2="24" y2="35.5" stroke="#C04070" stroke-width="1"/>
              </svg>
            </div>
            <!-- Bird -->
            <div class="pf-animal-opt" title="Bird" onclick="selectAnimalAvatar(this,'bird')" data-key="bird">
              <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="24" fill="#E8F4FF"/>
                <!-- head crest -->
                <ellipse cx="20" cy="13" rx="3" ry="6" fill="#4AA8E8" transform="rotate(-20 20 13)"/>
                <ellipse cx="24" cy="11" rx="2.5" ry="5" fill="#5ABAF0"/>
                <ellipse cx="28" cy="13" rx="3" ry="6" fill="#4AA8E8" transform="rotate(20 28 13)"/>
                <!-- head -->
                <circle cx="24" cy="26" r="13" fill="#7AC8F0"/>
                <!-- cheek patches -->
                <circle cx="17" cy="28" r="4" fill="#F07070" opacity="0.6"/>
                <circle cx="31" cy="28" r="4" fill="#F07070" opacity="0.6"/>
                <!-- eyes -->
                <circle cx="19.5" cy="23" r="3.5" fill="#fff"/>
                <circle cx="28.5" cy="23" r="3.5" fill="#fff"/>
                <circle cx="19.5" cy="23" r="2" fill="#1A1A2A"/>
                <circle cx="28.5" cy="23" r="2" fill="#1A1A2A"/>
                <circle cx="20.3" cy="22.2" r="0.7" fill="#fff"/>
                <circle cx="29.3" cy="22.2" r="0.7" fill="#fff"/>
                <!-- beak -->
                <polygon points="21,28.5 27,28.5 24,33" fill="#F0A030"/>
                <line x1="21" y1="30.8" x2="27" y2="30.8" stroke="#D08020" stroke-width="0.8"/>
              </svg>
            </div>
            <!-- Hamster -->
            <div class="pf-animal-opt" title="Hamster" onclick="selectAnimalAvatar(this,'hamster')" data-key="hamster">
              <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="24" fill="#FFF0D8"/>
                <!-- chubby cheeks -->
                <circle cx="11" cy="29" r="8" fill="#F8C890"/>
                <circle cx="37" cy="29" r="8" fill="#F8C890"/>
                <!-- ears -->
                <circle cx="13" cy="15" r="5.5" fill="#E8A060"/>
                <circle cx="35" cy="15" r="5.5" fill="#E8A060"/>
                <circle cx="13" cy="15" r="3.2" fill="#F8C8C8"/>
                <circle cx="35" cy="15" r="3.2" fill="#F8C8C8"/>
                <!-- head -->
                <ellipse cx="24" cy="27" rx="13" ry="12" fill="#F8D090"/>
                <!-- eyes -->
                <circle cx="19" cy="23" r="2.8" fill="#1A1010"/>
                <circle cx="29" cy="23" r="2.8" fill="#1A1010"/>
                <circle cx="19.8" cy="22.2" r="1" fill="#fff"/>
                <circle cx="29.8" cy="22.2" r="1" fill="#fff"/>
                <!-- nose -->
                <ellipse cx="24" cy="28.5" rx="2" ry="1.5" fill="#E06070"/>
                <!-- mouth -->
                <path d="M21.5 30 Q24 32.5 26.5 30" stroke="#B04050" stroke-width="1.1" fill="none" stroke-linecap="round"/>
                <!-- whiskers -->
                <line x1="9" y1="29" x2="18" y2="29.5" stroke="#C8A070" stroke-width="0.8"/>
                <line x1="9" y1="31" x2="18" y2="30.5" stroke="#C8A070" stroke-width="0.8"/>
                <line x1="39" y1="29" x2="30" y2="29.5" stroke="#C8A070" stroke-width="0.8"/>
                <line x1="39" y1="31" x2="30" y2="30.5" stroke="#C8A070" stroke-width="0.8"/>
              </svg>
            </div>
            <!-- Turtle -->
            <div class="pf-animal-opt" title="Turtle" onclick="selectAnimalAvatar(this,'turtle')" data-key="turtle">
              <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="24" fill="#E8F4E8"/>
                <!-- shell -->
                <ellipse cx="24" cy="26" rx="16" ry="13" fill="#5A9A5A"/>
                <!-- shell pattern -->
                <polygon points="24,15 30,20 28,27 20,27 18,20" fill="#3A7A3A"/>
                <ellipse cx="16" cy="24" rx="4.5" ry="5.5" fill="#3A7A3A"/>
                <ellipse cx="32" cy="24" rx="4.5" ry="5.5" fill="#3A7A3A"/>
                <ellipse cx="20" cy="33" rx="5" ry="3.5" fill="#3A7A3A"/>
                <ellipse cx="28" cy="33" rx="5" ry="3.5" fill="#3A7A3A"/>
                <!-- shell highlight -->
                <ellipse cx="24" cy="22" rx="7" ry="5" fill="#70BA70" opacity="0.4"/>
                <!-- head -->
                <ellipse cx="24" cy="14" rx="7" ry="6" fill="#6AB070"/>
                <!-- eyes -->
                <circle cx="21" cy="12.5" r="2" fill="#1A2A1A"/>
                <circle cx="27" cy="12.5" r="2" fill="#1A2A1A"/>
                <circle cx="21.6" cy="12" r="0.7" fill="#fff"/>
                <circle cx="27.6" cy="12" r="0.7" fill="#fff"/>
                <!-- mouth -->
                <path d="M21 16.5 Q24 18.5 27 16.5" stroke="#3A6A3A" stroke-width="1" fill="none" stroke-linecap="round"/>
              </svg>
            </div>
            <!-- Fish -->
            <div class="pf-animal-opt" title="Fish" onclick="selectAnimalAvatar(this,'fish')" data-key="fish">
              <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="24" fill="#E0F0FF"/>
                <!-- tail -->
                <polygon points="38,18 48,12 48,36 38,30" fill="#4080D0"/>
                <polygon points="38,18 48,12 48,36 38,30" fill="#5090E0" opacity="0.5"/>
                <!-- body -->
                <ellipse cx="24" cy="24" rx="18" ry="11" fill="#5090E0"/>
                <!-- scales -->
                <path d="M20 17 Q24 20 28 17" stroke="#4080C8" stroke-width="1.2" fill="none"/>
                <path d="M16 20 Q20 23 24 20" stroke="#4080C8" stroke-width="1.2" fill="none"/>
                <path d="M24 20 Q28 23 32 20" stroke="#4080C8" stroke-width="1.2" fill="none"/>
                <path d="M18 25 Q22 28 26 25" stroke="#4080C8" stroke-width="1.2" fill="none"/>
                <!-- belly -->
                <ellipse cx="22" cy="26" rx="10" ry="5" fill="#A8D0F8" opacity="0.5"/>
                <!-- eye -->
                <circle cx="12" cy="22" r="4.5" fill="#fff"/>
                <circle cx="12" cy="22" r="2.8" fill="#1A3A5A"/>
                <circle cx="13" cy="20.8" r="1" fill="#fff"/>
                <!-- fin top -->

<!-- Toast -->
<div class="pf-toast" id="pf-toast"></div>

<script>
const SUPA_URL = 'https://aemkdummdrmxtwrkggjw.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlbWtkdW1tZHJteHR3cmtnZ2p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTQwNjEsImV4cCI6MjA5NTY3MDA2MX0.JzUojqfs9K6wOtrhjDnQ_knVU1wDvqR0MFH9z_r4G4s';
const H = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' };

function getUserInfo() {
  // Try medsync_user first (used by portfolio/main app), then medsync_session fallback
  for (const store of [localStorage, sessionStorage]) {
    for (const key of ['medsync_user', 'medsync_session']) {
      try {
        const raw = store.getItem(key);
        if (raw) {
          const u = JSON.parse(raw);
          // Normalize: full_name → name
          if (u.full_name && !u.name) u.name = u.full_name;
          if (u.name || u.email) return u;
        }
      } catch(e) {}
    }
  }
  return { name: 'MedSync User', role: 'staff', email: '', locationId: '', locationName: '' };
}

let _currentAvatarB64 = null;

function showToast(msg, type) {
  const t = document.getElementById('pf-toast');
  t.textContent = msg;
  t.className = 'pf-toast' + (type ? ' ' + type : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

function updateCharCount() {
  const v = document.getElementById('pf-bio').value;
  document.getElementById('pf-char-count').textContent = v.length;
}

function setAvatarDisplay(b64, name) {
  const circle = document.getElementById('pf-avatar-circle');
  const initEl = document.getElementById('pf-avatar-initials');
  if (b64) {
    // Show image
    circle.innerHTML = '<img src="' + b64 + '" alt="Profile photo">';
  } else {
    // Show initials
    const parts = (name || '?').split(' ');
    const ini = parts.map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
    initEl.textContent = ini;
    circle.innerHTML = '';
    circle.appendChild(initEl);
  }
}

function handlePhotoUpload(input) {
  const file = input.files[0];
  if (!file) return;
  // Clear any animal selection
  document.querySelectorAll('.pf-animal-opt').forEach(el => el.classList.remove('selected'));
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const MAX = 400;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      _currentAvatarB64 = canvas.toDataURL('image/jpeg', 0.85);
      setAvatarDisplay(_currentAvatarB64, document.getElementById('pf-display-name').textContent);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function selectAnimalAvatar(el, key) {
  // Highlight selected tile
  document.querySelectorAll('.pf-animal-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  // Render the SVG to a canvas at 400×400 and store as data URL
  const svgEl = el.querySelector('svg');
  const svgStr = new XMLSerializer().serializeToString(svgEl);
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = 400; canvas.height = 400;
    canvas.getContext('2d').drawImage(img, 0, 0, 400, 400);
    URL.revokeObjectURL(url);
    _currentAvatarB64 = canvas.toDataURL('image/png');
    setAvatarDisplay(_currentAvatarB64, document.getElementById('pf-display-name').textContent);
  };
  img.src = url;
}

async function changePassword() {
  const newPw  = document.getElementById('pw-new').value.trim();
  const confPw = document.getElementById('pw-confirm').value.trim();
  const errEl  = document.getElementById('pw-error');
  errEl.style.display = 'none';

  if (!newPw) { errEl.textContent = 'Please enter a new password.'; errEl.style.display = 'block'; return; }
  if (newPw.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return; }
  if (newPw !== confPw) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }

  // Get the user's access token from session storage
  let accessToken = null;
  for (const store of [localStorage, sessionStorage]) {
    for (const key of ['medsync_session', 'medsync_user']) {
      try {
        const raw = store.getItem(key);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.access_token) { accessToken = parsed.access_token; break; }
        }
      } catch(e) {}
    }
    if (accessToken) break;
  }

  if (!accessToken) {
    errEl.textContent = 'Session expired — please log out and log back in, then try again.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.querySelector('[onclick="changePassword()"]');
  btn.disabled = true;
  btn.textContent = 'Updating…';

  try {
    const res = await fetch(SUPA_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + accessToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ password: newPw })
    });
    if (res.ok) {
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-confirm').value = '';
      showToast('✓ Password updated successfully', 'success');
    } else {
      const err = await res.json().catch(() => ({}));
      errEl.textContent = err.message || 'Password update failed. Please try again.';
      errEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = 'Network error — please check your connection and try again.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Update password';
  }
}

async function loadProfile() {
  const user = getUserInfo();
  const userId = user.id || user.email || user.name || '';
  const name = user.name || user.full_name || 'MedSync User';
  const role = user.role || 'staff';
  const locationName = user.locationName || user.location_name || user.location || '';

  // Set basic nav info from session
  document.getElementById('pf-display-name').textContent = name;
  document.getElementById('pf-display-role').textContent = role;
  document.getElementById('pf-page-heading').textContent = 'My Profile';
  document.getElementById('pf-email').value = user.email || '';
  document.getElementById('pf-location').value = locationName;

  const roleSelect = document.getElementById('pf-role-select');
  if (roleSelect) roleSelect.value = role;
  document.getElementById('pf-display-role').textContent =
    role === 'medsync_superadmin' ? 'Superadmin' :
    role === 'admin' ? 'Admin' :
    role === 'manager' ? 'Hospital Director' :
    role === 'hospital_manager' ? 'Hospital Manager' :
    role === 'inventory_lead' ? 'Inventory Lead' :
    role === 'receiver' ? 'Receiver' : role.replace(/_/g, ' ');

  // Show initials by default
  const parts = name.split(' ');
  const ini = parts.map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
  document.getElementById('pf-avatar-initials').textContent = ini;

  if (!userId) return;

  try {
    const res = await fetch(
      SUPA_URL + '/rest/v1/user_profiles?user_id=eq.' + encodeURIComponent(userId) + '&limit=1',
      { headers: H }
    );
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) {
      const p = data[0];
      if (p.first_name) document.getElementById('pf-first-name').value = p.first_name;
      if (p.last_name) document.getElementById('pf-last-name').value = p.last_name;
      if (p.email) document.getElementById('pf-email').value = p.email;
      if (p.phone) document.getElementById('pf-phone').value = p.phone;
      if (p.bio) {
        document.getElementById('pf-bio').value = p.bio;
        updateCharCount();
      }
      if (p.avatar_b64) {
        _currentAvatarB64 = p.avatar_b64;
        setAvatarDisplay(p.avatar_b64, name);
      } else {
        setAvatarDisplay(null, name);
      }
      // Update display name from first/last if present
      if (p.first_name || p.last_name) {
        const fullName = [p.first_name, p.last_name].filter(Boolean).join(' ');
        document.getElementById('pf-display-name').textContent = fullName;
      }
    } else {
      setAvatarDisplay(null, name);
      // Pre-fill first/last from session name
      const nameParts = name.split(' ');
      if (nameParts.length >= 2) {
        document.getElementById('pf-first-name').value = nameParts[0];
        document.getElementById('pf-last-name').value = nameParts.slice(1).join(' ');
      } else if (nameParts.length === 1) {
        document.getElementById('pf-first-name').value = nameParts[0];
      }
    }
  } catch(err) {
    console.error('Profile load error:', err);
    setAvatarDisplay(null, name);
  }
}

async function saveProfile() {
  const user = getUserInfo();
  const userId = user.id || user.email || user.name || '';
  if (!userId) { showToast('Not logged in', 'error'); return; }

  const btn = document.querySelector('.pf-save-btn');
  btn.textContent = 'Saving…';
  btn.disabled = true;

  const firstName = document.getElementById('pf-first-name').value.trim();
  const lastName = document.getElementById('pf-last-name').value.trim();
  const phone = document.getElementById('pf-phone').value.trim();
  const email = document.getElementById('pf-email').value.trim();
  const roleSelect = document.getElementById('pf-role-select');
  const role = roleSelect ? roleSelect.value : null;

  const payload = {
    user_id: userId,
    first_name: firstName,
    last_name: lastName,
    email: email,
    phone: phone,
    updated_at: new Date().toISOString(),
  };

  // Also update the users table full_name + email (non-role fields the anon key can touch via RLS)
  try {
    const fullName = [firstName, lastName].filter(Boolean).join(' ');
    if (fullName || email) {
      const userPayload = {};
      if (fullName) userPayload.full_name = fullName;
      if (email) userPayload.email = email;
      await fetch(`${SUPA_URL}/rest/v1/users?id=eq.${encodeURIComponent(userId)}`, {
        method: 'PATCH',
        headers: { ...H, 'Prefer': 'return=minimal' },
        body: JSON.stringify(userPayload),
      });
    }
  } catch(e) { /* non-fatal */ }

  try {
    const res = await fetch(SUPA_URL + '/rest/v1/user_profiles', {
      method: 'POST',
      headers: { ...H, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    // Update display name
    const fullName = [firstName, lastName].filter(Boolean).join(' ');
    if (fullName) document.getElementById('pf-display-name').textContent = fullName;

    showToast('Profile saved!', 'success');
  } catch(err) {
    console.error(err);
    showToast('Could not save profile', 'error');
  } finally {
    btn.textContent = 'Save Changes';
    btn.disabled = false;
  }
}

async function saveBio() {
  const user = getUserInfo();
  const userId = user.id || user.email || user.name || '';
  if (!userId) { showToast('Not logged in', 'error'); return; }

  const btn = document.querySelector('.pf-save-bio-btn');
  btn.textContent = 'Saving…';
  btn.disabled = true;

  const bio = document.getElementById('pf-bio').value.trim();

  const payload = {
    user_id: userId,
    bio: bio,
    updated_at: new Date().toISOString(),
  };
  if (_currentAvatarB64) payload.avatar_b64 = _currentAvatarB64;

  try {
    const res = await fetch(SUPA_URL + '/rest/v1/user_profiles', {
      method: 'POST',
      headers: { ...H, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    showToast('Bio & photo saved!', 'success');
  } catch(err) {
    console.error(err);
    showToast('Could not save bio', 'error');
  } finally {
    btn.textContent = 'Save Bio & Photo';
    btn.disabled = false;
  }
}

// Init
loadProfile();
</script>
