name: ScoutSync Uncategorized Round 2 Probe

# Round 2: what's left in the uncategorized long tail after the first
# batch of recommendations was applied? See
# scoutsync_uncategorized_round2_probe.py. Manual trigger only.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run round 2 uncategorized probe
        run: python3 scoutsync_uncategorized_round2_probe.py
