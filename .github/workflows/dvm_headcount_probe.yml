name: DVM Headcount Probe

# One-off: current active DVM headcount by location (encounters since
# ACTIVE_SINCE), for the paraprofessional staffing-ratio analysis. Reads
# Supabase over the public anon key already embedded client-side in
# scoutsync_dashboard.html -- no secret needed. Manual trigger only.
#
# Runs on a GitHub-hosted runner (not this session's sandbox) because the
# sandbox's egress policy doesn't allow reaching Supabase directly.

on:
  workflow_dispatch:
    inputs:
      active_since:
        description: 'Only count providers with an encounter on/after this date (YYYY-MM-DD)'
        required: false
        default: '2026-07-01'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DVM headcount probe
        run: python3 scoutsync_dvm_headcount_probe.py --active-since "${{ github.event.inputs.active_since }}"
