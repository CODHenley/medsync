name: ScoutSync Bulk Category Apply

# User-authorized bulk categorization of real uncategorized Vetspire
# services. See scoutsync_bulk_category_apply.py. Manual trigger only.

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply category recommendations
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 scoutsync_bulk_category_apply.py
