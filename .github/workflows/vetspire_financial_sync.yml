name: Vetspire Financial Sync

# Populates ScoutSync's invoice_line_items (Revenue by Source, Revenue per
# Veterinarian) from Vetspire's salesReport, broken down by provider +
# product category at day-level granularity.
#
# Validated against production (130 rows, 4 locations, zero errors), but the
# first run only covered the default 3-day lookback — the reconciliation
# check against daily_revenue's full 30-day history showed ~90% "missing"
# because of that gap, not a data error. Still manual-dispatch-only: use
# lookback_days to backfill further back once and confirm reconciliation
# actually closes before adding a schedule trigger.

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of history to pull (default 3; use e.g. 30 for a one-time backfill)'
        required: false
        default: '3'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Vetspire financial sync
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
        run: python3 vetspire_financial_sync.py
