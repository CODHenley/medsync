name: Vetspire Financial Sync

# Populates ScoutSync's invoice_line_items (Revenue by Source, Revenue per
# Veterinarian) from Vetspire's salesReport, broken down by provider +
# product category at day-level granularity.
#
# Validated against production: a 30-day backfill (lookback_days=30) upserted
# 1,295 rows across all 4 locations with zero errors, and the reconciliation
# check against daily_revenue's 30-day baseline closed to 0-1.6% variance per
# location (was ~90% "missing" before the backfill, due to the default 3-day
# lookback only covering 3 of the 30 days being compared). Now scheduled
# every 4 hours, matching vetspire_clinical_sync.yml — the 3-day default
# lookback gives a self-healing overlap window for routine runs.

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of history to pull (default 3; use e.g. 30 for a one-time backfill)'
        required: false
        default: '3'
  schedule:
    - cron: '0 */4 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Vetspire financial sync
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
        run: python3 vetspire_financial_sync.py
