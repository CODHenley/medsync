name: Wheaton Aug 4 Probe

# One-off: Wheaton is flagged "Scheduled, $0 revenue" for Aug 4, 2026 on
# the Days Closed report, but the user is seeing real appointment activity
# for that day directly in Vetspire. Pulls everything ScoutSync has synced
# for Wheaton that date across provider_shifts, the revenue view, the raw
# invoice_line_items, and appointment_events to see what's actually there.
# Supabase-only -- no Vetspire token needed.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Wheaton Aug 4 probe
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 scoutsync_wheaton_aug4_probe.py
