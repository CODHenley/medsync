name: Vetspire Diagnosis Utilization Audit

# One-off report: by-provider fill-rate breakdown for Vetspire's structured
# diagnosis features (Encounter.problems, Patient.patientDiagnoses) versus
# the free-text appointment reason-for-visit -- see
# vetspire_diagnosis_utilization_audit.py. Report-only, no Supabase writes.
# Manual trigger only.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Trailing window in days'
        required: false
        default: '180'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run diagnosis utilization audit
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 vetspire_diagnosis_utilization_audit.py --days "${{ inputs.days }}"
