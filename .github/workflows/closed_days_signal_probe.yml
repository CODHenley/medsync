name: Closed Days Signal Probe

# One-off: compare the revenue-based "closed day" signal (what the shipped
# Days Closed report currently uses) against an encounter-based signal, per
# location, over the trailing 365 days -- the user reports real closures at
# Lincoln Park / Old Orchard / West Loop that the revenue-based signal isn't
# catching. Manual trigger only; runs on a GitHub-hosted runner because this
# session's sandbox can't reach Supabase directly.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run closed-days signal probe
        run: python3 scoutsync_closed_days_signal_probe.py
