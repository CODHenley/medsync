name: ScoutSync Category Write-back Test

# Single-item, user-authorized test: does our Vetspire API token have
# write access to updateProductProductCategory? See
# scoutsync_category_writeback_test.py. Manual trigger only.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run category write-back test
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 scoutsync_category_writeback_test.py
