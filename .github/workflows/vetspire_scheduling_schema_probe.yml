name: Vetspire Scheduling Schema Probe

# One-off introspection: does Vetspire expose anything that shows staff were
# scheduled/working on a given day independent of whether any billable
# encounter happened -- a shift/roster type, a practice hours/closure
# calendar, or an Appointment type queryable on its own (a booked/no-show
# appointment would mean the practice was open and taking appointments even
# with zero revenue that day). Needed to distinguish "staffed but slow" from
# "actually closed" in the Days Closed & Financial Impact report. Manual
# trigger only.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Vetspire scheduling schema probe
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 vetspire_scheduling_schema_probe.py --token "$VETSPIRE_API_TOKEN"
