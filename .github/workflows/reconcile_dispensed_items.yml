name: Reconcile Dispensed Items vs Vetspire

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:
    inputs:
      days:
        description: "Trailing window size in days"
        required: false
        default: "14"
      tolerance_pct:
        description: "Allowed variance %% before failing"
        required: false
        default: "0.5"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run reconciliation
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: |
          python3 reconcile_dispensed_items.py \
            --days "${{ inputs.days || '14' }}" \
            --tolerance-pct "${{ inputs.tolerance_pct || '0.5' }}"
