name: ScoutSync Heatmap Cross-check

# One-off report: cross-checks v_case_heatmap's day/hour bucketing against
# an independently-pulled coworker spreadsheet of raw appointment counts,
# and tests whether the view's extract(dow/hour from started_at) is
# silently using UTC instead of America/Chicago -- see
# scoutsync_heatmap_crosscheck.py. Report-only, no writes. Manual trigger
# only.

on:
  workflow_dispatch:

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run heatmap cross-check
        run: python3 scoutsync_heatmap_crosscheck.py
