name: Backfill Dispensed Items Date Range

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2026-08-01'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        default: '2026-08-05'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backfill
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 backfill_date_range.py ${{ inputs.start_date }} ${{ inputs.end_date }}
