name: Vetspire Clinical Sync

# Populates ScoutSync's Clinical Operations tables (encounters, providers,
# clients, patients, referral_relationships, records_release_log).
#
# Validated via manual dispatch against production data (214 encounters,
# 181 clients, 186 patients, 11 providers, 223 referral relationships,
# no errors) before this schedule was added — same 4-hour cadence as
# nightly_sync.yml, since this is core Vetspire data of the same kind.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of history to pull (default 3; use e.g. 30 for a one-time backfill)'
        required: false
        default: '3'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Vetspire clinical sync
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
        run: python3 vetspire_clinical_sync.py
