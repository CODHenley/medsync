name: ScoutSync Second-DVM Threshold Probe

# One-off report: investigates whether a single DVM regularly sees 12+
# cases/day per location, seriously enough to justify a second 1.0 FTE DVM
# there. See scoutsync_second_dvm_threshold_probe.py. Report-only, no
# writes. Manual trigger only.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run second-DVM threshold probe
        run: python3 scoutsync_second_dvm_threshold_probe.py
