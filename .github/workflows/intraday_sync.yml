name: Intraday Vetspire Sync

on:
  schedule:
    - cron: '*/15 14-23 * * *'  # every 15 min, 8 AM–5 PM CST (UTC-6)
    - cron: '*/15 0-4 * * *'   # every 15 min, 6 PM–10 PM CST (UTC-6)
  workflow_dispatch:        # manual trigger from GitHub Actions UI
  push:
    branches: [main]        # backstop: sync on every deploy

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Pull today's dispensed items for all locations
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 vetspire_intraday_sync.py
