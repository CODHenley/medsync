name: ScoutSync Check Order Item Row

# Round 3 diagnostic (part 3): does a specific order_item_id we confirmed
# Vetspire returns correctly-categorized for actually exist in Supabase's
# dispensed_items, and with what product_category_id? See
# scoutsync_check_order_item_row.py. Manual trigger only. Read-only.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run order item row check
        run: python3 scoutsync_check_order_item_row.py
