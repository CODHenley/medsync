name: ScoutSync Check 523783 Live Category

# Round 3 diagnostic (part 2): does Vetspire's usageReport (used by
# dispensed_items_backfill.py) actually return current productCategories
# for order items, or is that field stale/broken relative to a direct
# product(id) lookup? See scoutsync_check_523783_live.py. Manual trigger
# only. Read-only.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run live category check
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 scoutsync_check_523783_live.py
