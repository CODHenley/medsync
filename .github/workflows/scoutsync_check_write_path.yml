name: ScoutSync Check Write Path

# Does dispensed_items_backfill.py's WRITE actually persist the category
# it fetches, for specific order items already confirmed correct on the
# read side? See scoutsync_check_write_path.py. Manual trigger only.
# Read-only (Supabase side).

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run write path check
        run: python3 scoutsync_check_write_path.py
