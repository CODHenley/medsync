name: Locations Probe

# One-off: check the `locations` table's open_date values plus each
# location's earliest/latest encounter, to scope the closed-days finance
# report. Reads Supabase over the public anon key already embedded
# client-side in scoutsync_dashboard.html -- no secret needed. Manual
# trigger only; runs on a GitHub-hosted runner because this session's
# sandbox can't reach Supabase directly.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run locations probe
        run: python3 scoutsync_locations_probe.py
