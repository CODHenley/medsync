name: ScoutSync Service Category Probe

# One-off: can a "services within a category, with instance counts" drill-down
# be built on the existing dispensed_items (usageReport.orderItems) pipeline?
# See scoutsync_service_category_probe.py. Manual trigger only; deleted once
# its purpose is served.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run service category probe
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 scoutsync_service_category_probe.py
