name: Verify Full Backfill

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run verification
        env:
          SUPA_SERVICE_KEY: ${{ secrets.SUPA_SERVICE_KEY }}
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 verify_full_backfill.py
