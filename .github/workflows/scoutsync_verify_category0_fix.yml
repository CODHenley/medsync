name: ScoutSync Verify Category0 Fix

# Verify the full-history dispensed_items_backfill run actually fixed the
# category-0 backlog. See scoutsync_verify_category0_fix.py. Manual
# trigger only. Read-only.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run verify
        run: python3 scoutsync_verify_category0_fix.py
