name: ScoutSync Check Data Floor

# Why does "Trailing 365 days" on the dashboard only show about half a
# year of real data, across all locations? Checks the earliest
# invoice_line_items date (overall and per location) plus dispensed_items
# for comparison. See scoutsync_check_data_floor.py. Manual trigger only.
# Read-only.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run data floor check
        run: python3 scoutsync_check_data_floor.py
