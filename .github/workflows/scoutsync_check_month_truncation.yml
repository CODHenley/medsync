name: ScoutSync Check Month Truncation

# Root-cause hunt: does usageReport silently truncate orderItems for a
# full calendar month at a busy location, explaining why
# dispensed_items_backfill.py's full-history re-runs never fix old
# high-volume-product rows? See scoutsync_check_month_truncation.py.
# Manual trigger only. Read-only.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run month truncation check
        env:
          VETSPIRE_API_TOKEN: ${{ secrets.VETSPIRE_API_TOKEN }}
        run: python3 scoutsync_check_month_truncation.py
