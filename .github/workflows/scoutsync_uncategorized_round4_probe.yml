name: ScoutSync Uncategorized Round 4 Probe

# One-off report: lists every currently distinct uncategorized product_name
# in dispensed_items plus the full product_categories reference list --
# see scoutsync_uncategorized_round4_probe.py. Report-only, no writes.
# Manual trigger only.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run round 4 uncategorized probe
        run: python3 scoutsync_uncategorized_round4_probe.py
