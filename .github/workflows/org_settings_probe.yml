name: Org Settings Probe

# One-off: check organization_settings/location_settings COGS targets and
# purchase_history's real source/row shape before building the ScoutSync
# Budget vs Spend report. Supabase-only -- no Vetspire token needed.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run org settings probe
        run: python3 scoutsync_org_settings_probe.py
